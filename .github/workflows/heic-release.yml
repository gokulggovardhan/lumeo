name: HEIC Release Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/heic-to-jpeg/**'
      - 'components/heic/**'
      - 'lib/heic-to-jpeg/**'
      - 'components/pdf/workspace/ToolWorkspace.tsx'
      - 'e2e/heic-to-jpeg.spec.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/heic-release.yml'

permissions:
  contents: read

concurrency:
  group: heic-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify HEIC Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - name: HEIC unit and inspection tests
        run: node --no-warnings --test --experimental-strip-types tests/heic-to-jpeg.test.ts inspector/*.test.ts
      - name: Type check
        run: npx tsc --noEmit
      - name: HEIC lint
        run: npm exec eslint -- app/heic-to-jpeg/page.tsx components/heic/HeicToJpegTool.tsx components/pdf/workspace/ToolWorkspace.tsx lib/heic-to-jpeg e2e/heic-to-jpeg.spec.ts
      - name: Generate high-resolution HEIC regression fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick libheif-examples libheif-plugin-x265
          mkdir -p /tmp/lumeo-heic-fixtures
          convert -size 6048x8064 gradient:'#203858-#e9bf78' \
            -fill '#e54868' -draw 'rectangle 0,0 900,1100' \
            -fill '#34b985' -draw 'rectangle 5000,6900 6047,8063' \
            /tmp/lumeo-heic-fixtures/fullres-source.png
          heif-enc -q 55 -t 1536 /tmp/lumeo-heic-fixtures/fullres-source.png \
            -o /tmp/lumeo-heic-fixtures/fullres-with-thumbnail.heic
          heif-info /tmp/lumeo-heic-fixtures/fullres-with-thumbnail.heic | tee /tmp/lumeo-heic-fixtures/heif-info.txt
          grep -Eq 'image: 6048x8064 .*primary' /tmp/lumeo-heic-fixtures/heif-info.txt
          grep -Eq 'thumbnail: 1152x1536' /tmp/lumeo-heic-fixtures/heif-info.txt
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: HEIC browser E2E
        env:
          HEIC_RESOLUTION_FIXTURE: /tmp/lumeo-heic-fixtures/fullres-with-thumbnail.heic
        run: npm run test:e2e -- e2e/heic-to-jpeg.spec.ts --project=chromium --project=webkit
      - name: Production build
        run: npm run build


  production-smoke:
    name: Verify live HEIC production
    if: github.event_name == 'pull_request' && github.head_ref == 'research/heic-production-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - name: Generate high-resolution HEIC regression fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick libheif-examples libheif-plugin-x265
          mkdir -p /tmp/lumeo-heic-fixtures
          convert -size 6048x8064 gradient:'#203858-#e9bf78' \
            -fill '#e54868' -draw 'rectangle 0,0 900,1100' \
            -fill '#34b985' -draw 'rectangle 5000,6900 6047,8063' \
            /tmp/lumeo-heic-fixtures/fullres-source.png
          heif-enc -q 55 -t 1536 /tmp/lumeo-heic-fixtures/fullres-source.png \
            -o /tmp/lumeo-heic-fixtures/fullres-with-thumbnail.heic
          heif-info /tmp/lumeo-heic-fixtures/fullres-with-thumbnail.heic | tee /tmp/lumeo-heic-fixtures/heif-info.txt
          grep -Eq 'image: 6048x8064 .*primary' /tmp/lumeo-heic-fixtures/heif-info.txt
          grep -Eq 'thumbnail: 1152x1536' /tmp/lumeo-heic-fixtures/heif-info.txt
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise actual production and inspect downloaded JPEG bytes
        env:
          E2E_BASE_URL: https://lumeo.in
          HEIC_RESOLUTION_FIXTURE: /tmp/lumeo-heic-fixtures/fullres-with-thumbnail.heic
        run: npm run test:e2e -- e2e/heic-to-jpeg.spec.ts --project=chromium --project=webkit
