# Keeps graphify-out/ current without anyone having to remember.
#
# CLAUDE.md instructs every reader -- human and agent -- to consult the graph
# BEFORE reading source. That makes it load-bearing documentation, and it was
# being refreshed by hand: last rebuild 2026-08-11, five days and four merged
# PRs behind by the time anyone noticed.
#
# Rebuild-and-commit rather than fail-the-build, deliberately. Failing a PR
# when the graph is stale keeps the human in the loop, which is the exact
# thing that was already failing -- it converts "someone forgets" into
# "someone forgets and is then blocked", and the fastest way past a blocking
# check is to regenerate without looking. Committing on merge removes the
# person from the loop entirely, which is the only version that actually
# fixes the defect.
#
# The tradeoff, stated plainly: graph.json is ~3.5 MB, so every merge that
# touches code adds a blob of that order to history. If the repo size becomes
# a problem, the fallback is to stop committing the artifact and publish it
# from CI instead -- but that is a bigger change than this defect warrants.

name: Refresh graphify graph

on:
  push:
    branches: [main]
    # Without this the bot's own commit re-triggers the workflow. The bot only
    # ever writes under graphify-out/, so ignoring that path is a complete
    # loop guard and does not need a [skip ci] convention or an actor check.
    paths-ignore:
      - 'graphify-out/**'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graphify-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Rebuild code graph
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Pinned. An unpinned extractor would let an upstream release rewrite
      # the whole graph in a commit whose message says "refresh".
      # The [sql] extra pulls tree_sitter_sql; without it graphify drops all
      # 30 supabase/migrations .sql files with a warning rather than an error.
      - name: Install graphify
        run: pip install "graphifyy[sql]==0.9.44"

      # --force is required, not optional: the default refuses to write a
      # graph with fewer nodes than the last one, which is exactly what a PR
      # that deletes code produces.
      - name: Rebuild graph
        run: graphify update . --force

      # Community names come from an LLM and are the ONLY part of the graph
      # that needs one. Edges, nodes and traversal are pure AST, so they must
      # refresh whether or not a key is configured -- they are the part that
      # was already useful. Without GEMINI_API_KEY the labels fall back to
      # each community's largest member filename ("page.tsx"); weak, but
      # honest and app-scoped, and never a reason to skip the rebuild.
      - name: Name communities
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: graphify label .

      - name: Commit refreshed graph
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only the curated outputs. cache/, dated snapshots and .graphify_*
          # scratch are gitignored and must stay that way.
          git add graphify-out/graph.json \
                  graphify-out/graph.html \
                  graphify-out/GRAPH_REPORT.md \
                  graphify-out/manifest.json

          if git diff --cached --quiet; then
            echo "Graph already current for ${GITHUB_SHA}; nothing to commit."
            exit 0
          fi

          git commit -m "chore(graphify): refresh graph for ${GITHUB_SHA:0:7}" \
                     -m "Generated by .github/workflows/graphify-refresh.yml. Do not hand-edit."
          git push
