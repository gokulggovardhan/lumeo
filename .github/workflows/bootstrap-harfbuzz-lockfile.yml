name: Bootstrap HarfBuzz lockfile

on:
  push:
    branches:
      - feature/edit-harfbuzz-shaping-rebased
    paths:
      - .github/workflows/bootstrap-harfbuzz-lockfile.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shaping branch
        uses: actions/checkout@v4
        with:
          ref: feature/edit-harfbuzz-shaping-rebased
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate npm package and lockfile
        run: npm install --save-exact harfbuzzjs@1.6.2 --ignore-scripts

      - name: Commit npm-generated dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(edit): pin HarfBuzz shaping dependency"
          git push origin HEAD:feature/edit-harfbuzz-shaping-rebased
