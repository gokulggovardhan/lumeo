name: Edit native colour UI implementation

on:
  push:
    branches:
      - feat/edit-native-text-color-ui-clean
    paths:
      - .github/workflows/edit-native-color-ui-implementation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edit-native-text-color-ui-clean
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply controlled product patch
        run: python3 .github/scripts/apply-native-color-ui.py

      - name: Review staged implementation diff
        run: |
          git diff --check
          git diff --stat
          git diff -- components/pdf/EditPdfTool.tsx lib/pdf/edit/nativePaint.ts lib/pdf/edit/applyEditPlan.ts tests/edit-native-paint.test.ts tests/edit-native-paint-document.test.ts

      - name: Focused native paint tests
        run: npm test -- tests/edit-native-paint.test.ts tests/edit-native-paint-apply.test.ts tests/edit-native-paint-document.test.ts tests/edit-session.test.ts

      - name: Focused lint
        run: npx eslint components/pdf/EditPdfTool.tsx lib/pdf/edit/nativePaint.ts lib/pdf/edit/applyEditPlan.ts tests/edit-native-paint.test.ts tests/edit-native-paint-document.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-native-color-ui.py .github/workflows/edit-native-color-ui-implementation.yml
          git add components/pdf/EditPdfTool.tsx lib/pdf/edit/nativePaint.ts lib/pdf/edit/applyEditPlan.ts tests/edit-native-paint.test.ts tests/edit-native-paint-document.test.ts
          git diff --cached --check
          git status --short
          git commit -m "feat(edit): add safe native text colour UI"
          git push origin HEAD:feat/edit-native-text-color-ui-clean
