name: Bootstrap HarfBuzz lockfile

on:
  push:
    branches:
      - feature/edit-harfbuzz-shaping-foundation-rebased

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shaping branch
        uses: actions/checkout@v7
        with:
          ref: feature/edit-harfbuzz-shaping-foundation-rebased
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Generate combined npm dependency graph
        run: npm install harfbuzzjs@1.6.2 --save-exact --ignore-scripts

      - name: Verify fontkit and HarfBuzz pins coexist
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          if (pkg.dependencies?.["@cantoo/fontkit"] !== "2.0.12") {
            throw new Error("@cantoo/fontkit 2.0.12 was not preserved");
          }
          if (pkg.dependencies?.["harfbuzzjs"] !== "1.6.2") {
            throw new Error("harfbuzzjs 1.6.2 was not pinned exactly");
          }
          if (lock.packages?.["node_modules/@cantoo/fontkit"]?.version !== "2.0.12") {
            throw new Error("fontkit lock entry missing");
          }
          if (lock.packages?.["node_modules/harfbuzzjs"]?.version !== "1.6.2") {
            throw new Error("HarfBuzz lock entry missing");
          }
          if (lock.packages?.["node_modules/harfbuzzjs"]?.license !== "MIT") {
            throw new Error("Unexpected HarfBuzz package license");
          }
          NODE

      - name: Remove one-shot bootstrap workflow
        run: rm .github/workflows/bootstrap-harfbuzz-lock.yml

      - name: Commit npm-generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/bootstrap-harfbuzz-lock.yml
          git commit -m "build(edit): generate combined HarfBuzz lockfile [skip ci]"
          git push origin HEAD:feature/edit-harfbuzz-shaping-foundation-rebased
