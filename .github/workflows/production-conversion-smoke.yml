name: Production Conversion Smoke

on:
  push:
    branches:
      - release/conversion-production-smoke
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-conversion-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Live Word ↔ PDF smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Verify production converters and downloaded files
        run: npx playwright test --config=playwright.production-conversion.config.ts

      - name: Upload production traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-conversion-smoke-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
