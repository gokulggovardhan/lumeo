name: Production Conversion Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-conversion-smoke.yml"
      - "components/pdf/WordToPdfTool.tsx"
      - "components/pdf/PdfToWordTool.tsx"
      - "components/pdf/HtmlToPdfTool.tsx"
      - "lib/conversion/**"
      - "lib/pdf/htmlToPdfOptions.ts"
      - "worker/**"
      - "config/office-runtime-release.json"
      - "app/office-runtime/**"
      - "e2e/production-conversion-smoke.spec.ts"
      - "playwright.production-conversion.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-conversion-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Live Word ↔ PDF + HTML smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Wait for exact Cloudflare production revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          deployed_commit=""
          deployed_environment=""

          for attempt in {1..30}; do
            body="$(curl --silent --show-error --fail --max-time 30 https://lumeo.in/api/build-info || true)"
            deployed_commit="$(node -e 'try { const value = JSON.parse(process.argv[1]); process.stdout.write(value.commit ?? ""); } catch {}' "$body")"
            deployed_environment="$(node -e 'try { const value = JSON.parse(process.argv[1]); process.stdout.write(value.environment ?? ""); } catch {}' "$body")"

            if [ "$deployed_commit" = "$EXPECTED_SHA" ] && [ "$deployed_environment" = "production" ]; then
              echo "PASS production revision $deployed_commit"
              exit 0
            fi

            echo "Waiting for Cloudflare revision: expected $EXPECTED_SHA, observed ${deployed_commit:-none} (${deployed_environment:-unknown}) attempt $attempt/30"
            sleep 10
          done

          echo "FAIL production did not reach expected revision $EXPECTED_SHA"
          exit 1

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Verify production converters and downloaded files
        run: xvfb-run -a npx playwright test --config=playwright.production-conversion.config.ts

      - name: Upload production traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-conversion-smoke-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
