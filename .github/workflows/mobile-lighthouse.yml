name: Mobile Lighthouse

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run-mobile-lighthouse.mjs"
      - ".lighthouserc.cjs"
      - ".github/workflows/mobile-lighthouse.yml"
      - "tests/mobile-lighthouse-contract.test.ts"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "worker/**"
      - "scripts/run-mobile-lighthouse.mjs"
      - ".lighthouserc.cjs"
      - ".github/workflows/mobile-lighthouse.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-lighthouse-production
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Mobile production performance, accessibility and SEO budgets
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install exact dependencies
        run: npm ci

      - name: Install pinned Lighthouse runtime for CI only
        run: npm install --no-save --package-lock=false lighthouse@13.5.0 chrome-launcher@1.2.1

      - name: Wait for exact Cloudflare production revision
        if: github.event_name == 'push'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            body="$(curl --silent --show-error --fail --max-time 30 https://lumeo.in/api/build-info || true)"
            deployed_commit="$(
              BODY="$body" node -e '
                try {
                  const value = JSON.parse(process.env.BODY || "{}");
                  process.stdout.write(typeof value.commit === "string" ? value.commit : "");
                } catch {}
              '
            )"
            deployed_environment="$(
              BODY="$body" node -e '
                try {
                  const value = JSON.parse(process.env.BODY || "{}");
                  process.stdout.write(typeof value.environment === "string" ? value.environment : "");
                } catch {}
              '
            )"

            if [ "$deployed_commit" = "$EXPECTED_SHA" ] && [ "$deployed_environment" = "production" ]; then
              echo "PASS exact production revision $deployed_commit"
              exit 0
            fi

            echo "Waiting for Cloudflare revision: expected $EXPECTED_SHA, observed ${deployed_commit:-none} (attempt $attempt/30)"
            sleep 10
          done

          echo "FAIL production did not reach expected revision $EXPECTED_SHA" >&2
          exit 1

      - name: Collector smoke uses current certified production
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --silent --show-error --fail --max-time 30 https://lumeo.in/api/build-info)"
          BODY="$body" node -e '
            const value = JSON.parse(process.env.BODY || "{}");
            if (value.environment !== "production" || typeof value.commit !== "string" || value.commit.length < 7) {
              throw new Error("Collector smoke requires a valid production build-info response.");
            }
            console.log("Collector smoke target production revision", value.commit);
          '

      - name: Warm audited production routes
        shell: bash
        run: |
          set -euo pipefail
          for route in / /pdf /pdf-tools /pdf/edit; do
            curl --fail --silent --show-error --max-time 30 "https://lumeo.in$route" >/dev/null
          done

      - name: Run mobile Lighthouse budgets
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/run-mobile-lighthouse.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

