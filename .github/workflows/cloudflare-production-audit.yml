name: Cloudflare Production Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-production-audit.yml"
      - "next.config.ts"
      - "app/layout.tsx"
      - "app/robots.ts"
      - "app/sitemap.ts"
      - "wrangler.jsonc"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "worker/**"
      - "e2e/cloudflare-production.spec.ts"
      - "playwright.cloudflare-production.config.ts"
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: read

concurrency:
  group: cloudflare-production-audit
  cancel-in-progress: true

jobs:
  audit-production:
    name: Audit lumeo.in on Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Verify DNS and canonical host routing
        id: routing
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          echo "A records:"
          dig +short A lumeo.in || true
          echo "AAAA records:"
          dig +short AAAA lumeo.in || true
          echo "www CNAME:"
          dig +short CNAME www.lumeo.in || true

          dns_dump="$( (dig +short A lumeo.in; dig +short AAAA lumeo.in; dig +short CNAME lumeo.in; dig +short CNAME www.lumeo.in) 2>/dev/null | tr '[:upper:]' '[:lower:]' )"
          retired_host="$(printf '%s%s' 'ver' 'cel')"
          if printf '%s' "$dns_dump" | grep -Eqi "${retired_host}|${retired_host}-dns|now[.]sh"; then
            echo "FAIL: DNS still contains a retired hosting-provider hostname."
            exit 1
          fi

          http_headers="$(curl --silent --show-error --head --max-time 30 http://lumeo.in/)"
          http_code="$(printf '%s' "$http_headers" | awk '/^HTTP\// { code=$2 } END { print code }')"
          http_location="$(printf '%s' "$http_headers" | awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); print $2}' | tail -1)"
          case "$http_code" in 301|302|307|308) ;; *) echo "FAIL: HTTP apex returned $http_code"; exit 1;; esac
          case "$http_location" in https://lumeo.in|https://lumeo.in/*) ;; *) echo "FAIL: HTTP apex redirects to $http_location"; exit 1;; esac
          echo "PASS: HTTP redirects to canonical HTTPS apex."

          www_headers="$(curl --silent --show-error --head --max-time 30 https://www.lumeo.in/ || true)"
          www_code="$(printf '%s' "$www_headers" | awk '/^HTTP\// { code=$2 } END { print code }')"
          www_location="$(printf '%s' "$www_headers" | awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); print $2}' | tail -1)"
          test -n "$www_code" || { echo "FAIL: www.lumeo.in is unreachable."; exit 1; }
          case "$www_code" in
            301|302|307|308)
              case "$www_location" in https://lumeo.in|https://lumeo.in/*) ;; *) echo "FAIL: www redirects to $www_location"; exit 1;; esac
              ;;
            200) echo "FAIL: www serves duplicate HTTP 200 instead of redirecting to apex."; exit 1;;
            *) echo "FAIL: www returned HTTP $www_code"; exit 1;;
          esac
          echo "PASS: www redirects to canonical apex."

      - name: Verify Cloudflare edge and security headers
        id: edge
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --head --max-time 30 https://lumeo.in/)"

          get_header() {
            printf '%s' "$headers" | awk -F': ' -v wanted="$1" 'tolower($1)==tolower(wanted) {value=$2} END {gsub("\r","",value); print value}'
          }

          cf_ray="$(get_header cf-ray)"
          server="$(get_header server)"
          xfo="$(get_header x-frame-options)"
          xcto="$(get_header x-content-type-options)"
          referrer="$(get_header referrer-policy)"
          hsts="$(get_header strict-transport-security)"

          test -n "$cf_ray" || { echo "FAIL: cf-ray missing."; exit 1; }
          printf '%s' "$server" | grep -qi cloudflare || { echo "FAIL: server is not Cloudflare."; exit 1; }
          [ "$xfo" = "DENY" ] || { echo "FAIL: X-Frame-Options is $xfo"; exit 1; }
          [ "$xcto" = "nosniff" ] || { echo "FAIL: X-Content-Type-Options is $xcto"; exit 1; }
          [ "$referrer" = "strict-origin-when-cross-origin" ] || { echo "FAIL: Referrer-Policy is $referrer"; exit 1; }
          test -n "$hsts" || { echo "FAIL: HSTS missing."; exit 1; }
          echo "PASS: Cloudflare edge and baseline security headers verified."

      - name: Verify representative production routes
        id: routes
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for route in / /pdf-tools /pdf/merge /pdf/compress /pdf/edit /pdf/crop /pdf/watermark /heic-to-jpeg /sitemap.xml /robots.txt /favicon.ico; do
            status="$(curl --location --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 30 "https://lumeo.in$route")"
            [ "$status" = "200" ] || { echo "FAIL: $route returned HTTP $status"; exit 1; }
            echo "PASS: $route HTTP 200"
          done

      - name: Verify canonical metadata, robots and sitemap
        id: seo
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          home="$(curl --silent --show-error --max-time 30 https://lumeo.in/)"
          robots="$(curl --silent --show-error --max-time 30 https://lumeo.in/robots.txt)"
          sitemap="$(curl --silent --show-error --max-time 30 https://lumeo.in/sitemap.xml)"

          printf '%s' "$home" | grep -Fq 'https://lumeo.in' || { echo "FAIL: homepage canonical host missing."; exit 1; }
          retired_host="$(printf '%s%s' 'ver' 'cel')"
          if printf '%s\n%s\n%s' "$home" "$robots" "$sitemap" | grep -Eqi "${retired_host}[.]app|now[.]sh"; then
            echo "FAIL: public SEO output contains a retired hosting-provider hostname."
            exit 1
          fi
          printf '%s' "$robots" | grep -Fq 'https://lumeo.in/sitemap.xml' || { echo "FAIL: robots sitemap URL wrong."; exit 1; }
          for route in /heic-to-jpeg /pdf/edit /pdf/crop /pdf/watermark; do
            printf '%s' "$sitemap" | grep -Fq "https://lumeo.in$route" || { echo "FAIL: sitemap missing $route"; exit 1; }
          done
          echo "PASS: canonical metadata, robots and sitemap use lumeo.in."

      - name: Verify Admin is redirect-protected and non-cacheable
        id: admin
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --head --max-time 30 https://lumeo.in/admin)"
          status="$(printf '%s' "$headers" | awk '/^HTTP\// { code=$2 } END { print code }')"
          location="$(printf '%s' "$headers" | awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); print $2}' | tail -1)"
          cache_control="$(printf '%s' "$headers" | awk -F': ' 'tolower($1)=="cache-control" {gsub("\r","",$2); print tolower($2)}' | tail -1)"
          case "$status" in 301|302|303|307|308) ;; *) echo "FAIL: /admin returned $status"; exit 1;; esac
          case "$location" in /admin/login*|https://lumeo.in/admin/login*) ;; *) echo "FAIL: /admin redirect target is $location"; exit 1;; esac
          printf '%s' "$cache_control" | grep -q 'no-store' || { echo "FAIL: /admin missing no-store."; exit 1; }
          echo "PASS: Admin redirect and no-store policy verified."

      - name: Verify current static JavaScript chunk is fetchable
        id: assets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          home="$(curl --silent --show-error --max-time 30 https://lumeo.in/)"
          script_path="$(printf '%s' "$home" | grep -Eo 'src="[^"]+\.js[^"]*"' | head -1 | sed -E 's/^src="([^"]+)".*$/\1/')"
          test -n "$script_path" || { echo "FAIL: no JavaScript chunk found."; exit 1; }
          case "$script_path" in http://*|https://*) script_url="$script_path";; /*) script_url="https://lumeo.in$script_path";; *) script_url="https://lumeo.in/$script_path";; esac
          headers="$(curl --silent --show-error --head --max-time 30 "$script_url")"
          status="$(printf '%s' "$headers" | awk '/^HTTP\// { code=$2 } END { print code }')"
          content_type="$(printf '%s' "$headers" | awk -F': ' 'tolower($1)=="content-type" {gsub("\r","",$2); print tolower($2)}' | tail -1)"
          [ "$status" = "200" ] || { echo "FAIL: JS chunk returned HTTP $status"; exit 1; }
          printf '%s' "$content_type" | grep -Eq 'javascript|ecmascript' || { echo "FAIL: JS chunk content type is $content_type"; exit 1; }
          echo "PASS: current JavaScript chunk is fetchable with a JavaScript MIME type."

      - name: Report Cloudflare routing and header diagnostics
        if: always()
        shell: bash
        run: |
          set -u

          echo "--- apex HTTPS headers ---"
          apex_headers="$(curl --silent --show-error --head --max-time 30 https://lumeo.in/ || true)"
          for name in server cf-ray strict-transport-security x-frame-options x-content-type-options referrer-policy permissions-policy cache-control; do
            value="$(printf '%s' "$apex_headers" | awk -F': ' -v wanted="$name" 'tolower($1)==tolower(wanted) {value=$2} END {gsub("\r","",value); print value}')"
            echo "$name=${value:-<missing>}"
          done

          echo "--- www HTTPS ---"
          www_headers="$(curl --silent --show-error --head --max-time 30 https://www.lumeo.in/ || true)"
          www_status="$(printf '%s' "$www_headers" | awk '/^HTTP\// {code=$2} END {print code}')"
          www_location="$(printf '%s' "$www_headers" | awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); value=$2} END {print value}')"
          echo "status=${www_status:-<unreachable>}"
          echo "location=${www_location:-<missing>}"

          echo "--- apex HTTP ---"
          http_headers="$(curl --silent --show-error --head --max-time 30 http://lumeo.in/ || true)"
          http_status="$(printf '%s' "$http_headers" | awk '/^HTTP\// {code=$2} END {print code}')"
          http_location="$(printf '%s' "$http_headers" | awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); value=$2} END {print value}')"
          echo "status=${http_status:-<unreachable>}"
          echo "location=${http_location:-<missing>}"
      - name: Fail if any production audit section failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          outcomes="routing=${{ steps.routing.outcome }} edge=${{ steps.edge.outcome }} routes=${{ steps.routes.outcome }} seo=${{ steps.seo.outcome }} admin=${{ steps.admin.outcome }} assets=${{ steps.assets.outcome }}"
          echo "$outcomes"
          if printf '%s' "$outcomes" | grep -q 'failure'; then
            echo "One or more Cloudflare production audit sections failed."
            exit 1
          fi
          echo "All Cloudflare production audit sections passed."


  compare-edit-pdf-runtimes:
    name: Compare Edit PDF — Next vs vinext
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Next production application
        run: npm run build

      - name: Test Edit PDF on local Next production
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/lumeo-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/pdf/edit >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/lumeo-next.log
              exit 1
            fi
            sleep 1
          done

          CLOUDFLARE_AUDIT_BASE_URL=http://127.0.0.1:3000 \
            npx playwright test \
              --config=playwright.cloudflare-production.config.ts \
              --project=chromium-production \
              --grep "production Edit PDF"

          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Build vinext Cloudflare Worker
        run: npm run build:vinext

      - name: Start local Worker and test Edit PDF
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --config dist/server/wrangler.json --port 8787 > /tmp/lumeo-vinext.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8787/pdf/edit >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/lumeo-vinext.log
              exit 1
            fi
            sleep 1
          done

          CLOUDFLARE_AUDIT_BASE_URL=http://127.0.0.1:8787 \
            npx playwright test \
              --config=playwright.cloudflare-production.config.ts \
              --project=chromium-production \
              --grep "production Edit PDF"

  browser-production:
    name: Browser smoke — PDF.js + HEIC
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Generate real high-resolution HEIC fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick libheif-examples libheif-plugin-x265
          mkdir -p /tmp/lumeo-cloudflare-fixtures
          convert -size 6048x8064 gradient:'#203858-#e9bf78' \
            -fill '#e54868' -draw 'rectangle 0,0 900,1100' \
            -fill '#34b985' -draw 'rectangle 5000,6900 6047,8063' \
            /tmp/lumeo-cloudflare-fixtures/source.png
          heif-enc -q 55 -t 1536 /tmp/lumeo-cloudflare-fixtures/source.png \
            -o /tmp/lumeo-cloudflare-fixtures/fullres.heic
          { heif-info /tmp/lumeo-cloudflare-fixtures/fullres.heic || true; } | tee /tmp/lumeo-cloudflare-fixtures/heif-info.txt
          grep -Eq 'image: 6048x8064 .*primary' /tmp/lumeo-cloudflare-fixtures/heif-info.txt
          echo "HEIC_RESOLUTION_FIXTURE=/tmp/lumeo-cloudflare-fixtures/fullres.heic" >> "$GITHUB_ENV"

      - name: Install Chromium, WebKit and Firefox
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Test deployed PDF.js and HEIC/HEIF paths
        run: npx playwright test --config=playwright.cloudflare-production.config.ts

      - name: Verify live production contains Premium Edit PDF foundation
        shell: bash
        env:
          EDIT_FOUNDATION_SHA: d81fd383155645779e6e5db10df22215885e8f40
        run: |
          set -euo pipefail
          body="$(curl --silent --show-error --fail --max-time 30 https://lumeo.in/api/build-info)"
          deployed_commit="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.commit ?? "")' "$body")"
          deployed_environment="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.environment ?? "")' "$body")"
          [ "$deployed_environment" = "production" ] || { echo "FAIL production environment was $deployed_environment"; exit 1; }
          test -n "$deployed_commit" || { echo "FAIL production commit missing"; exit 1; }
          git fetch --no-tags origin "$deployed_commit" --depth=200 || git fetch --no-tags origin main --depth=200
          git merge-base --is-ancestor "$EDIT_FOUNDATION_SHA" "$deployed_commit" || {
            echo "FAIL deployed revision $deployed_commit does not contain Edit PDF foundation $EDIT_FOUNDATION_SHA"
            exit 1
          }
          echo "PASS deployed production $deployed_commit contains Edit PDF foundation $EDIT_FOUNDATION_SHA"
          echo "CERTIFIED_PRODUCTION_SHA=$deployed_commit" >> "$GITHUB_ENV"

      - name: Install deterministic conversion fidelity tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils python3-pil

      - name: Re-run live Word PDF and HTML conversion regression
        run: xvfb-run -a npx playwright test --config=playwright.production-conversion.config.ts

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-production-browser-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
