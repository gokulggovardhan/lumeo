name: Lumeo CI

on:
  push:
    branches:
      - main

  # Stacked PRs target a feature branch, not main. Without these patterns
  # `pull_request` never fires for them, so a stacked PR shows no checks at
  # all -- and a missing check is far easier to merge past than a red one.
  pull_request:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumeo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Lumeo PDF Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused Lumeo PDF lint
        run: >
          npm exec eslint --
          app/layout.tsx
          app/page.tsx
          app/opengraph-image.tsx
          app/twitter-image.tsx
          app/about/page.tsx
          app/accessibility/page.tsx
          app/contact/page.tsx
          app/guides/page.tsx
          app/privacy/page.tsx
          app/security/page.tsx
          app/terms/page.tsx
          app/pdf/page.tsx
          app/pdf/merge/page.tsx
          app/pdf/split/page.tsx
          app/pdf/compress/page.tsx
          app/pdf/jpg-to-pdf/page.tsx
          app/pdf/pdf-to-jpg/page.tsx
          app/pdf/sign/page.tsx
          app/pdf/word-to-pdf/page.tsx
          app/pdf/pdf-to-word/page.tsx
          app/pdf/organize/page.tsx
          app/pdf/extract-text/page.tsx
          app/pdf/html-to-pdf/page.tsx
          app/pdf/edit/page.tsx
          app/pdf/watermark/page.tsx
          components/PublicFooter.tsx
          components/PublicPdfChrome.tsx
          components/pdf/PdfToolLauncher.tsx
          components/pdf/PdfToolRegistry.tsx
          scripts/verify-public-routes.mjs

      - name: Verify admin authentication architecture
        run: npm run verify:admin-auth

      - name: Verify Control Center architecture
        run: npm run verify:control-center

      - name: Verify maintained release architecture
        run: |
          npm run verify:public-catalog
          npm run verify:analytics
          npm run verify:aura
          npm run verify:lumeo2-foundation
          npm run verify:lumeo2-public-experience
          npm run verify:lumeo2-workspaces

      - name: Run unit tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint application
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Build Cloudflare Worker
        run: npm run build:vinext

      - name: Validate Cloudflare Worker bundle
        run: npx vinext-cloudflare deploy --dry-run --config dist/server/wrangler.json

      - name: Verify public routes
        run: npm run verify:public

  admin-browser-e2e:
    name: Admin auth — Chromium + WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Initialize and start isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            npx supabase init
          fi
          npx supabase start

      - name: Configure disposable admin environment
        shell: bash
        run: |
          set -euo pipefail
          npx supabase status -o env > /tmp/lumeo-supabase.env
          set -a
          source /tmp/lumeo-supabase.env
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "ADMIN_E2E_EMAIL=admin-e2e@lumeo.local"
            echo "ADMIN_E2E_PASSWORD=Lumeo-E2E-Only-2026!"
          } >> "$GITHUB_ENV"

      - name: Create disposable local administrator
        run: node scripts/seed-admin-e2e.mjs

      - name: Verify Admin Inbox RLS roles
        run: node scripts/verify-admin-inbox-rls.mjs

      - name: Verify error and feedback ingestion rate limits
        run: node scripts/verify-error-ingest-rate-limit.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Chromium desktop/mobile and WebKit admin lifecycle
        run: npm run test:e2e:admin

      - name: Build Cloudflare Worker for Admin lifecycle
        run: npm run build:vinext

      - name: Run Admin lifecycle on local Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev \
            --config dist/server/wrangler.json \
            --port 8787 \
            --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL" \
            --var "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --var "SUPABASE_SERVICE_ROLE_KEY:$SUPABASE_SERVICE_ROLE_KEY" \
            > /tmp/lumeo-admin-worker.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8787/admin/login >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/lumeo-admin-worker.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            cat /tmp/lumeo-admin-worker.log
            exit 1
          fi

          npx playwright test --config=playwright.admin.cloudflare.config.ts

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: admin-auth-playwright-report
          path: |
            playwright-admin-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  migrate:
    name: Apply Supabase migrations
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Push pending migrations to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:migrate