name: Next.js 16.4.5 Security Lockfile Preview

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/next-security-lockfile-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    name: Resolve official Next.js security patch without repository writes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
      - name: Resolve patched Next.js and matching ESLint config
        run: |
          npm install --save --package-lock-only --ignore-scripts --no-audit --no-fund next@16.4.5
          npm install --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund eslint-config-next@16.4.5
      - name: Assert patched versions and absence of other security downgrades
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = {
            next: '16.4.5',
            'eslint-config-next': '16.4.5',
            '@fastify/busboy': '3.2.4',
            dompurify: '3.4.17',
            vite: '8.3.5',
            'source-map-js': '1.2.2',
            'brace-expansion': '1.1.21',
            '@typescript-eslint/typescript-estree/node_modules/brace-expansion': '5.0.12',
          };
          for (const [name, version] of Object.entries(expected)) {
            const resolved = lock.packages['node_modules/' + name]?.version;
            if (resolved !== version) throw new Error(name + ' expected ' + version + ', got ' + resolved);
          }
          if (pkg.dependencies.next !== '^16.4.5') throw new Error('Next direct version is not patched');
          if (pkg.devDependencies['eslint-config-next'] !== '^16.4.5') throw new Error('ESLint config not patched');
          if (lock.packages[''].dependencies.next !== '^16.4.5') throw new Error('Next root lockfile mismatch');
          console.log('PASS: security candidate resolves cleanly with no checked downgrades');
          NODE
      - name: Verify lockfile installability
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export source and lockfile for controlled integration
        uses: actions/upload-artifact@v7
        with:
          name: next-1645-security-resolved
          path: |
            package.json
            package-lock.json
          retention-days: 7
          if-no-files-found: error

      - name: Apply validated security patch to the single allowed PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/20261105-lumeo-dependency-release-candidate'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          git diff --cached --quiet && { echo "No patch resolved"; exit 1; }
          git commit -m "fix(security): install Next.js 16.4.5 November security fixes"
          # Protected main is never a push target. Fast-forward only.
          git push origin HEAD:refs/heads/integration/20261105-lumeo-dependency-release-candidate
