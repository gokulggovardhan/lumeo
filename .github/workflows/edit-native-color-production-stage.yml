name: Edit native colour production certification staging

on:
  push:
    branches:
      - feat/edit-native-text-color-ui-clean
    paths:
      - .github/workflows/edit-native-color-production-stage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/edit-native-text-color-ui-clean
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - run: npm ci

      - name: Apply production certification patch
        run: python3 .github/scripts/patch-native-color-production.py

      - name: Validate production certification source
        run: |
          git diff --check
          npx eslint e2e/production-conversion-smoke.spec.ts
          npx tsc --noEmit

      - name: Commit production certification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/patch-native-color-production.py .github/workflows/edit-native-color-production-stage.yml
          git add e2e/production-conversion-smoke.spec.ts
          git diff --cached --check
          git status --short
          git commit -m "test(edit): extend production native colour certification"
          git push origin HEAD:feat/edit-native-text-color-ui-clean
