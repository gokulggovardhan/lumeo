          replace_once(
              "components/pdf/EditPdfTool.tsx",
              '''  const selectedNativeSpan =
            selectedRunIndices.length === 1
              ? pageTextModel?.spans[selectedRunIndices[0]] ?? null
              : null;

            const nativeStyleOverride = useMemo(() => {
          ''',
              '''  const selectedNativeSpan =
            selectedRunIndices.length === 1
              ? pageTextModel?.spans[selectedRunIndices[0]] ?? null
              : null;
            const selectedNativeRunMatchForStyle =
              selectedRunIndices.length === 1 ? runMatches[selectedRunIndices[0]] : null;
            const nativeFillColorCapability = useMemo(
              () =>
                selectedNativeRunMatchForStyle
                  ? nativeFillColorControlCapability(selectedNativeRunMatchForStyle.operator)
                  : ({
                      editable: false,
                      colorSpace: null,
                      cssHex: null,
                      reason: "Select one editable native text run to inspect its fill colour.",
                    } as const),
              [selectedNativeRunMatchForStyle],
            );

            const nativeStyleOverride = useMemo(() => {
          ''',
          )

          replace_once(
              "components/pdf/EditPdfTool.tsx",
              '''  }, [selectedNativeSpan, nativeStyleDraft]);

            // Phase 10: font resolution''',
              '''  }, [selectedNativeSpan, nativeStyleDraft]);

            const nativeFillColorChangeRequested = Boolean(
              selectedNativeSpan &&
                nativeStyleDraft?.spanId === selectedNativeSpan.id &&
                nativeStyleDraft.fillColorHex &&
                nativeFillColorCapability.editable &&
                nativeStyleDraft.fillColorHex.toLowerCase() !== nativeFillColorCapability.cssHex,
