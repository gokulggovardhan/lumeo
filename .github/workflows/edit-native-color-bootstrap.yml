name: Bootstrap Edit Native Colour UI

on:
  push:
    branches:
      - feat/edit-native-text-color-ui
    paths:
      - ".github/workflows/edit-native-color-bootstrap.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Apply focused native-colour implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # -----------------------------------------------------------------
          # 1) Document-level composition: preserve the proven document writer
          # and dynamically invoke PR #378's exact byte wrapper only when a
          # native paint plan is present. Existing callers remain byte-for-byte
          # on applyEditPlanToBytes.
          # -----------------------------------------------------------------
          replace_once(
              "lib/pdf/edit/applyEditPlan.ts",
              'import type { MultiRunEditPlan } from "./multiRunEditPlan.ts";\n',
              'import type { MultiRunEditPlan } from "./multiRunEditPlan.ts";\nimport type { NativePaintPlan } from "./nativePaint.ts";\n',
          )

          replace_once(
              "lib/pdf/edit/applyEditPlan.ts",
              '''export async function applyEditPlanToDocument(
            doc: PDFDocument,
            plan: EditPlan,
            bytesPerCode: 1 | 2,
            options: { isolate?: boolean } = {},
          ): Promise<void> {
            assertApplicable(plan);
          ''',
              '''async function applyEditPlanBytesForDocument(
            contentStreamBytes: Uint8Array,
            plan: EditPlan,
            bytesPerCode: 1 | 2,
            fallbackResourceName: string | undefined,
            nativePaintPlan: NativePaintPlan | undefined,
          ): Promise<Uint8Array> {
            if (!nativePaintPlan) {
              return applyEditPlanToBytes(contentStreamBytes, plan, bytesPerCode, { fallbackResourceName });
            }

            // Keep the dependency one-way at module initialization time:
            // nativePaintApply.ts already imports applyEditPlanToBytes from
            // this module. Loading it only for a requested paint edit avoids
            // a static circular import while still using PR #378's proven
            // byte-level composition contract exactly.
            const { applyEditPlanWithNativePaintToBytes } = await import("./nativePaintApply.ts");
            return applyEditPlanWithNativePaintToBytes(
              contentStreamBytes,
              plan,
              bytesPerCode,
              nativePaintPlan,
              { fallbackResourceName },
            );
          }

          export async function applyEditPlanToDocument(
            doc: PDFDocument,
            plan: EditPlan,
            bytesPerCode: 1 | 2,
            options: { isolate?: boolean; nativePaintPlan?: NativePaintPlan } = {},
          ): Promise<void> {
            assertApplicable(plan);
          ''',
          )

          replace_once(
              "lib/pdf/edit/applyEditPlan.ts",
              '    const newBytes = applyEditPlanToBytes(target.decodedBytes, plan, bytesPerCode, { fallbackResourceName });\n',
              '    const newBytes = await applyEditPlanBytesForDocument(target.decodedBytes, plan, bytesPerCode, fallbackResourceName, options.nativePaintPlan);\n',
          )
          replace_once(
              "lib/pdf/edit/applyEditPlan.ts",
              '  const newBytes = applyEditPlanToBytes(located.decodedBytes, plan, bytesPerCode, { fallbackResourceName });\n',
              '  const newBytes = await applyEditPlanBytesForDocument(located.decodedBytes, plan, bytesPerCode, fallbackResourceName, options.nativePaintPlan);\n',
          )

          # -----------------------------------------------------------------
          # 2) One UI capability contract beside the planner. It intentionally
          # refuses CMYK conversion and all rendering modes whose fill cannot
          # be changed safely/restored exactly.
          # -----------------------------------------------------------------
          replace_once(
              "lib/pdf/edit/nativePaint.ts",
              '''export function paintChannelsForRenderingMode(
            renderMode: number,
          ): Readonly<{ fill: boolean; stroke: boolean }> {
            switch (renderMode) {
              case 0:
                return { fill: true, stroke: false };
              case 1:
                return { fill: false, stroke: true };
              case 2:
                return { fill: true, stroke: true };
              default:
                return { fill: false, stroke: false };
            }
          }

          /**
          ''',
              '''export function paintChannelsForRenderingMode(
            renderMode: number,
          ): Readonly<{ fill: boolean; stroke: boolean }> {
            switch (renderMode) {
              case 0:
                return { fill: true, stroke: false };
              case 1:
                return { fill: false, stroke: true };
              case 2:
                return { fill: true, stroke: true };
              default:
                return { fill: false, stroke: false };
            }
          }

          export type NativeFillColorControlCapability =
            | {
                editable: true;
                colorSpace: "DeviceGray" | "DeviceRGB";
                cssHex: string;
                reason: null;
              }
            | {
                editable: false;
                colorSpace: PdfPaintColorSpace | null;
                cssHex: null;
                reason: string;
              };

          /**
           * User-facing capability for the browser colour picker. This is
           * deliberately narrower than buildNativePaintPlan: the writer can
           * serialize CMYK exactly, but a browser <input type="color"> is RGB.
           * Lumeo therefore exposes Gray/RGB fills only and leaves CMYK exact
           * rather than inventing a conversion that was not present in the PDF.
           */
          export function nativeFillColorControlCapability(
            operator: Pick<TextShowOperator, "renderMode" | "fillColor">,
          ): NativeFillColorControlCapability {
            if (!Number.isInteger(operator.renderMode) || operator.renderMode < 0 || operator.renderMode > 7) {
              return {
                editable: false,
                colorSpace: operator.fillColor?.colorSpace ?? null,
                cssHex: null,
                reason: "This text has an invalid PDF rendering mode, so its fill colour cannot be changed safely.",
              };
            }
            if (operator.renderMode >= 4) {
              return {
                editable: false,
                colorSpace: operator.fillColor?.colorSpace ?? null,
                cssHex: null,
                reason: "This text contributes to a clipping path, so native fill-colour editing is disabled.",
              };
            }
            if (operator.renderMode === 3) {
              return {
                editable: false,
                colorSpace: operator.fillColor?.colorSpace ?? null,
                cssHex: null,
                reason: "This text is invisible, so a visible fill-colour edit would not have a defined effect.",
              };
            }
            if (!paintChannelsForRenderingMode(operator.renderMode).fill) {
              return {
                editable: false,
                colorSpace: operator.fillColor?.colorSpace ?? null,
                cssHex: null,
                reason: "This text rendering mode does not paint glyph fills.",
              };
            }
            if (!operator.fillColor) {
              return {
                editable: false,
                colorSpace: null,
                cssHex: null,
                reason: "The original native fill colour is unknown, so Lumeo cannot restore it exactly after an edit.",
              };
            }
            const validation = validateNativePaintColor(operator.fillColor);
            if (validation) {
              return {
                editable: false,
                colorSpace: operator.fillColor.colorSpace,
                cssHex: null,
                reason: validation,
              };
            }
            if (operator.fillColor.colorSpace === "DeviceCMYK") {
              return {
                editable: false,
                colorSpace: "DeviceCMYK",
                cssHex: null,
                reason: "This text uses native CMYK colour. Lumeo preserves those components exactly and does not guess a CMYK-to-RGB value for the browser colour picker.",
              };
            }
            if (!operator.fillColor.cssHex) {
              return {
                editable: false,
                colorSpace: operator.fillColor.colorSpace,
                cssHex: null,
                reason: "This native fill does not have a proven browser RGB representation.",
              };
            }
            return {
              editable: true,
              colorSpace: operator.fillColor.colorSpace,
              cssHex: operator.fillColor.cssHex.toLowerCase(),
              reason: null,
            };
          }

          /**
          ''',
          )

