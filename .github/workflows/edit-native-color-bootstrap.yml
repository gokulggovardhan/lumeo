          Path("tests/edit-native-fill-color-control.test.ts").write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { nativeFillColorControlCapability } from "../lib/pdf/edit/nativePaint.ts";
          import type { PdfPaintColor } from "../lib/pdf/edit/contentStream.ts";

          const gray: PdfPaintColor = { colorSpace: "DeviceGray", components: [0.25], cssHex: "#404040" };
          const rgb: PdfPaintColor = { colorSpace: "DeviceRGB", components: [0.2, 0.4, 0.6], cssHex: "#336699" };
          const cmyk: PdfPaintColor = { colorSpace: "DeviceCMYK", components: [0.1, 0.2, 0.3, 0.4], cssHex: null };

          test("native fill colour UI exposes proven Gray and RGB fills", () => {
            assert.deepEqual(nativeFillColorControlCapability({ renderMode: 0, fillColor: gray }), {
              editable: true,
              colorSpace: "DeviceGray",
              cssHex: "#404040",
              reason: null,
            });
            assert.deepEqual(nativeFillColorControlCapability({ renderMode: 2, fillColor: rgb }), {
              editable: true,
              colorSpace: "DeviceRGB",
              cssHex: "#336699",
              reason: null,
            });
          });

          test("native fill colour UI refuses CMYK conversion instead of inventing RGB", () => {
            const capability = nativeFillColorControlCapability({ renderMode: 0, fillColor: cmyk });
            assert.equal(capability.editable, false);
            assert.equal(capability.colorSpace, "DeviceCMYK");
            assert.match(capability.reason, /preserves.*exactly.*does not guess.*CMYK-to-RGB/i);
          });

          test("native fill colour UI stays capability-limited for unknown, stroke-only, invisible and clipping text", () => {
            const unknown = nativeFillColorControlCapability({ renderMode: 0, fillColor: null });
            assert.equal(unknown.editable, false);
            assert.match(unknown.reason, /unknown.*restore/i);

            const strokeOnly = nativeFillColorControlCapability({ renderMode: 1, fillColor: rgb });
            assert.equal(strokeOnly.editable, false);
            assert.match(strokeOnly.reason, /does not paint glyph fills/i);

            const invisible = nativeFillColorControlCapability({ renderMode: 3, fillColor: rgb });
            assert.equal(invisible.editable, false);
            assert.match(invisible.reason, /invisible/i);

            const clipping = nativeFillColorControlCapability({ renderMode: 4, fillColor: rgb });
            assert.equal(clipping.editable, false);
            assert.match(clipping.reason, /clipping path/i);
          });
          '''.replace("          ", ""))

          Path("tests/edit-native-paint-document.test.ts").write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { PDFDict, PDFDocument, PDFName, StandardFonts, rgb } from "pdf-lib";
          import { applyEditPlanToDocument } from "../lib/pdf/edit/applyEditPlan.ts";
          import { buildEditPlan } from "../lib/pdf/edit/editPlan.ts";
          import { resolveFont } from "../lib/pdf/edit/fontEncoding.ts";
          import { resolveFontMetrics } from "../lib/pdf/edit/fontMetrics.ts";
          import { collectPageTextOperators } from "../lib/pdf/edit/formXObjects.ts";
          import { buildNativePaintPlan, paintColorFromCssHex } from "../lib/pdf/edit/nativePaint.ts";

          test("document writer composes native RGB fill with the proven text edit and restores the neighbour", async () => {
            const source = await PDFDocument.create();
            const page = source.addPage([612, 792]);
            const font = await source.embedFont(StandardFonts.Helvetica);
            page.drawText("Color target", { x: 72, y: 700, size: 18, font, color: rgb(0, 0, 1) });
            page.drawText("Neighbor", { x: 72, y: 660, size: 18, font, color: rgb(0, 0, 1) });

            const loaded = await PDFDocument.load(await source.save());
            const located = collectPageTextOperators(loaded, 0);
            assert.ok(located.length >= 2);
            const target = located[0];
            assert.equal(target.operator.fillColor?.cssHex, "#0000ff");
            assert.ok(target.operator.fontResourceName);

            const fonts = target.resources.lookup(PDFName.of("Font"), PDFDict);
            const fontDict = fonts?.lookup(PDFName.of(target.operator.fontResourceName!), PDFDict);
            assert.ok(fontDict);
            const resolvedFont = resolveFont(fontDict!, loaded.context);
            const metrics = resolveFontMetrics(fontDict!, loaded.context, resolvedFont);
            const plan = buildEditPlan({
              pageIndex: 0,
              contentStreamIndex: target.locator.kind === "page" ? target.locator.contentStreamIndex : 0,
