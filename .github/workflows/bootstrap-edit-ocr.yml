name: Bootstrap Edit PDF OCR dependency

on:
  push:
    branches:
      - feature/edit-local-ocr-foundation
    paths:
      - ".github/workflows/bootstrap-edit-ocr.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[ocr-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/edit-local-ocr-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install exact OCR dependencies
        run: npm install --save-exact tesseract.js@7.0.0 @tesseract.js-data/eng@1.0.0

      - name: Commit npm-generated dependency graph
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(edit): pin local OCR dependencies [ocr-bootstrap]"
          git push origin HEAD:feature/edit-local-ocr-foundation
