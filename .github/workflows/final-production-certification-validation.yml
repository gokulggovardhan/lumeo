name: Final production certification validation

on:
  push:
    branches:
      - fix/production-certification-final
    paths:
      - ".github/workflows/final-production-certification-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/production-certification-final

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - run: npm ci

      - name: Static validation
        run: |
          git diff --check
          npx eslint e2e/production-conversion-smoke.spec.ts e2e/production-conversion-certification.spec.ts
          npx tsc --noEmit

      - name: Install deterministic document tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils python3-pil

      - name: Install production browser matrix
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Run full live production matrix
        run: xvfb-run -a npx playwright test --config=playwright.production-conversion.config.ts
