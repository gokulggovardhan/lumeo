name: Bootstrap Edit PDF HarfBuzz dependency lock

on:
  push:
    branches:
      - feature/edit-harfbuzz-shaping-rebased
    paths:
      - .github/workflows/bootstrap-edit-harfbuzz-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/edit-harfbuzz-shaping-rebased
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact shaping dependency
        run: npm install --save-exact harfbuzzjs@1.6.2

      - name: Remove one-shot bootstrap workflow
        run: rm .github/workflows/bootstrap-edit-harfbuzz-lock.yml

      - name: Commit generated package metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/bootstrap-edit-harfbuzz-lock.yml
          if git diff --cached --quiet; then
            echo "No package metadata changes were required."
            exit 0
          fi
          git commit -m "build(edit): pin HarfBuzz shaping dependency"
          git push origin HEAD:feature/edit-harfbuzz-shaping-rebased
